<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38d9c0"/>
      <stop offset="100%" stop-color="#6c8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#accent)"/>

  <!-- Centered content -->
  <g transform="translate(400, 400)">
    <!-- Main icon -->
    <circle r="140" fill="rgba(56,217,192,0.1)" stroke="url(#accent)" stroke-width="3"/>
    <text x="0" y="12" text-anchor="middle" font-size="80">🌐</text>

    <!-- Title -->
    <text x="0" y="220" text-anchor="middle" font-family="Inter,system-ui" font-size="36" font-weight="800" fill="#e8edf7" letter-spacing="-0.5">
      Web Developer
    </text>
    <text x="0" y="270" text-anchor="middle" font-family="Inter,system-ui" font-size="22" font-weight="400" fill="#9aa8c2">
      Responsive sites • Web apps • Flutter mobile
    </text>

    <!-- Divider -->
    <rect x="-80" y="310" width="160" height="4" rx="2" fill="url(#accent)"/>

    <!-- Skills pills -->
    <g transform="translate(0, 350)">
      <g class="pill" transform="translate(-200, 0)">
        <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(56,217,192,0.15)" stroke="#38d9c0" stroke-width="1.5"/>
        <text x="90" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#38d9c0">HTML • CSS • JS</text>
      </g>
      <g class="pill" transform="translate(20, 0)">
        <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(108,140,255,0.15)" stroke="#6c8cff" stroke-width="1.5"/>
        <text x="90" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#6c8cff">React (basic)</text>
      </g>
      <g class="pill" transform="translate(-200, 70)">
        <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(2,196,142,0.15)" stroke="#02c48e" stroke-width="1.5"/>
        <text x="90" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#02c48e">Flutter / Dart</text>
      </g>
      <g class="pill" transform="translate(20, 70)">
        <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(229,72,77,0.15)" stroke="#e5484d" stroke-width="1.5"/>
        <text x="90" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#e5484d">Bug Fixes</text>
      </g>
    </g>

    <!-- Portfolio link -->
    <g transform="translate(0, 530)">
      <rect x="-160" y="0" width="320" height="56" rx="28" fill="url(#accent)" filter="url(#glow)"/>
      <text x="0" y="36" text-anchor="middle" font-family="Inter" font-size="20" font-weight="700" fill="#06231f">
        View Portfolio →
      </text>
    </g>

    <!-- URL -->
    <text x="0" y="610" text-anchor="middle" font-family="Inter" font-size="16" fill="#5a6a8a">
      portfolio-two-theta-39.vercel.app
    </text>
  </g>
</svg>